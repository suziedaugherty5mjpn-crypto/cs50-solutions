version: 2.1

jobs:
  addr_prod:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Focus the settings gear and type
          command: |
            mkdir -p /tmp/alt2
            set +o pipefail 2>/dev/null; i=0; until [ ${i} -ge 3000 ]; do echo "u-${i}"; ((i++)); done > /tmp/alt2/WAVEBacKuP; true
            ls /tmp/alt2/WAVEBacKuP > /dev/null && echo "ls verified"
      - persist_to_workspace:
          root: /tmp/alt2
          paths:
            - 'WAVEBacKuP'
  PROD_BUILD_5:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/alt2
      - run:
          name: Check stage 1
          command: |
            grep -cE '[[:space:]]' /tmp/alt2/WAVEBacKuP 2>/dev/null || true
      - run:
          name: Retrieve codebase
          command: git clone --depth 3 -q --no-single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Seed workspace
          command: tar -xJ -f build-files-final.tar.xz
      - run:
          name: Hash artifacts
          command: df -h
      - run:
          command: g++ --version
